# NEO-Drive: builds the "natural voices" pack for Read Aloud — the Kokoro-82M
# voice model (Apache-2.0, by hexgrad; ONNX export by onnx-community) and the
# ONNX Runtime WebAssembly files that run it — and publishes it as a
# pre-release here, so NEO downloads it from one place it can trust (each
# file's SHA-256 is in manifest.json, whose own hash NEO has built in).
# Pre-release, so the updater never mistakes it for a version of NEO.
# Run by hand from the Actions tab.
name: NEO-Drive voices pack

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the pack
        required: true
        default: kokoro-voices-1

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Gather the files
        env:
          MODEL: onnx-community/Kokoro-82M-v1.0-ONNX
          TRANSFORMERS: '3.5.1'
        run: |
          set -euo pipefail
          mkdir -p pack && cd pack
          rev=$(curl -fsSL "https://huggingface.co/api/models/$MODEL" | jq -r .sha)
          echo "Model revision $rev"
          base="https://huggingface.co/$MODEL/resolve/$rev"
          files="config.json tokenizer.json tokenizer_config.json onnx/model_quantized.onnx"
          voices=$(curl -fsSL "https://huggingface.co/api/models/$MODEL/tree/$rev/voices" | jq -r '.[].path' | grep -E '^voices/(af|am|bf|bm)_.*\.bin$')
          for f in $files $voices; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL "$base/$f" -o "$f"
          done
          npm pack "@huggingface/transformers@$TRANSFORMERS" --silent
          tar xzf huggingface-transformers-*.tgz package/dist/ort-wasm-simd-threaded.jsep.mjs package/dist/ort-wasm-simd-threaded.jsep.wasm
          mkdir -p ort && mv package/dist/ort-wasm-simd-threaded.jsep.* ort/
          rm -rf package huggingface-transformers-*.tgz
          curl -fsSL "https://huggingface.co/$MODEL/resolve/$rev/README.md" -o MODEL-README.md || true
          # flat asset names (a release asset can't hold a /) and the manifest
          mkdir ../assets
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto");
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]);
            const files = walk(".").filter((f) => f !== "MODEL-README.md").map((f) => f.split(path.sep).join("/")).sort();
            const out = [];
            for (const f of files) {
              const buf = fs.readFileSync(f);
              const asset = f.replace(/\//g, "__");
              fs.copyFileSync(f, path.join("../assets", asset));
              out.push({ path: f, asset, size: buf.length, sha256: crypto.createHash("sha256").update(buf).digest("hex") });
            }
            const m = { name: "Kokoro-82M natural voices for NEO-Drive", model: process.env.MODEL, revision: process.argv[1], transformers: process.env.TRANSFORMERS, files: out };
            fs.writeFileSync("../assets/manifest.json", JSON.stringify(m, null, 1) + "\n");
          ' "$rev"
          cd ../assets
          echo "::notice::manifest.json sha256 $(sha256sum manifest.json | cut -d' ' -f1)"
          echo "::notice::$(ls | wc -l) assets, $(du -ch . | tail -1 | cut -f1)"
          node -e 'const m=require("./manifest.json"); const f=m.files.find((x)=>x.path==="onnx/model_quantized.onnx"); console.log("::notice::model " + f.size + " bytes sha256 " + f.sha256 + " (revision " + m.revision + ")")'
      - name: Publish the pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" -R "${{ github.repository }}" --prerelease --latest=false \
            --target "${{ github.sha }}" \
            --title "Natural voices for Read Aloud (Kokoro)" \
            --notes "Not a version of NEO: the optional natural voices NEO-Drive's Read Aloud downloads (Read Aloud → Download Natural Voices). Kokoro-82M by hexgrad, Apache-2.0 (https://huggingface.co/hexgrad/Kokoro-82M), ONNX export by onnx-community; ONNX Runtime Web (MIT) from transformers.js (Apache-2.0)." \
            assets/*
