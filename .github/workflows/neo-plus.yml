# NEO+: keeps Ethan's fork current with Hugh Howey's NEO and ships it.
#
# Every day (and on every push to main, and by hand from the Actions tab):
#   1. merge Hugh's newest release tag from github.com/hughhowey/neo
#   2. run the NEO+ tests on the merged code
#   3. if anything changed since the last release, build the Windows
#      installer and publish it as a release here — the copy of NEO on
#      Ethan's computer finds it and updates itself, as it always has.
#
# If Hugh's changes collide with ours, nothing is merged or released: the
# run fails, an issue is opened, and the installed NEO stays as it is.
#
# Versions: Hugh's 1.4.0 becomes 1.4.1, 1.4.2, … here (patch × 100 + build),
# so ours always sort after his and after our own earlier builds.

name: NEO+ sync and release

on:
  schedule:
    - cron: '17 9 * * *'   # 5:17 am New York (EDT)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: neo-plus-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      neo: ${{ steps.plan.outputs.neo }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Hugh's releases (kept apart from our own tags)
        run: |
          git remote add upstream https://github.com/hughhowey/neo.git
          git fetch --no-tags upstream main '+refs/tags/v*:refs/upstream-tags/v*'
          latest=$(git for-each-ref --format='%(refname:short)' refs/upstream-tags | sed 's#^upstream-tags/##' | sort -V | tail -1)
          echo "Hugh's latest release: $latest"
          echo "UPSTREAM_TAG=$latest" >> "$GITHUB_ENV"

      - name: Merge it
        id: merge
        run: |
          git config user.name "neo-plus-bot"
          git config user.email "neo-plus-bot@users.noreply.github.com"
          if git merge-base --is-ancestor "refs/upstream-tags/$UPSTREAM_TAG" HEAD; then
            echo "Already have $UPSTREAM_TAG."
            exit 0
          fi
          if git merge --no-edit -m "Merge Hugh's NEO $UPSTREAM_TAG" "refs/upstream-tags/$UPSTREAM_TAG"; then
            echo "Merged $UPSTREAM_TAG."
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "conflict=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report a conflict
        if: failure() && steps.merge.outputs.conflict == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hugh's $UPSTREAM_TAG doesn't merge cleanly"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then exit 0; fi
          {
            echo "NEO $UPSTREAM_TAG changed code that NEO+ also changes, so it wasn't merged and nothing was released."
            echo "Your installed NEO keeps working as it is."
            echo
            echo "Files in conflict:"
            sed 's/^/- /' conflicts.txt
            echo
            echo "Ask Claude to resolve the merge with Hugh's $UPSTREAM_TAG."
          } > body.md
          gh issue create --title "$title" --body-file body.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the merged code
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/neo-plus-*.test.js
          xvfb-run -a npx electron --no-sandbox scripts/neo-plus.e2e.js
          xvfb-run -a npx electron --no-sandbox scripts/neo-plus-sync.e2e.js
          xvfb-run -a npx electron --no-sandbox scripts/neo-plus-library.e2e.js
          xvfb-run -a npx electron --no-sandbox scripts/neo-plus-library-new.e2e.js

      - name: Push the merge
        run: git push origin HEAD:main

      - name: Decide whether to release
        id: plan
        run: |
          git fetch --tags origin
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$last" ] && git diff --quiet "$last" HEAD; then
            echo "Nothing new since $last."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # NEO+ has its own version (neo-plus/VERSION: major.minor); each
          # release is the next patch. Hugh's NEO version goes in the notes.
          base=$(node -p "require('./package.json').version")
          mm=$(tr -d ' \r\n' < neo-plus/VERSION)
          n=-1
          for t in $(git tag -l "v$mm.*"); do p=${t##*.}; [ "$p" -gt "$n" ] && n=$p; done
          version="$mm.$((n + 1))"
          echo "Releasing NEO+ $version (Hugh's NEO $base)."
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "neo=$base" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # Edit → Spellcheck With → Windows Spellchecker, on a real Windows machine
      - name: Test the Windows spellchecker
        run: npx electron scripts/neo-plus-spell.e2e.js
      # Read Aloud with the natural voices: the real download, the voice, the player
      - name: Test Read Aloud
        run: npx electron scripts/neo-plus-read.e2e.js
      # the library kept the same on two computers, with Windows' own file rules
      - name: Test library sync
        run: npx electron scripts/neo-plus-library.e2e.js
      # The app's Google sign-in (Settings → Secrets and variables → Actions).
      # Without the secrets the build still works; its Google Drive menu says
      # no sign-in is configured.
      - name: Google sign-in for this build
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('neo-plus/google-client.json', JSON.stringify({ client_id: process.env.GOOGLE_CLIENT_ID || '', client_secret: process.env.GOOGLE_CLIENT_SECRET || '' }))"
          if [ -z "$GOOGLE_CLIENT_ID" ]; then echo "::warning::No GOOGLE_CLIENT_ID secret: this build can't connect to Google Drive."; fi
      # The updater in the installed app reads its source from this build's
      # publish settings (app-update.yml inside the app): this repo, not Hugh's.
      - name: Build the installer
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis --x64 --publish never \
            -c.extraMetadata.version=${{ needs.sync.outputs.version }} \
            -c.publish.provider=github \
            -c.publish.owner=${{ github.repository_owner }} \
            -c.publish.repo=${{ github.event.repository.name }} \
            -c.nsis.artifactName='NEO-Plus-Setup-${version}.${ext}' \
            -c.nsis.shortcutName='NEO+' \
            -c.nsis.uninstallDisplayName='NEO+' 2>&1 | tee "$RUNNER_TEMP/build.log" || {
              # surface the cause as an annotation, readable without the raw log
              tail -40 "$RUNNER_TEMP/build.log" | tr '\n' ' ' | cut -c1-3500 | sed 's/^/::error title=electron-builder::/'
              exit 1
            }
          ls dist
      # (The log above goes outside the project on purpose: a file written
      # inside it while electron-builder packs gets packed half-written, and
      # an app.asar that doesn't match its own hashes is one Electron won't
      # start. v1.4.1–v1.4.4 shipped that way.)
      - name: The packed app is whole
        shell: bash
        run: node scripts/neo-plus-check-asar.js dist/win-unpacked/resources/app.asar
      - name: Smoke test — the app starts and makes its library
        shell: pwsh
        run: |
          $p = Start-Process "dist\win-unpacked\NEO.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Write-Output "::error::NEO exited at once (code $($p.ExitCode))"; exit 1 }
          if (-not (Test-Path "$env:USERPROFILE\Documents\NEO Library\library.json")) { Write-Output "::error::NEO started but never made its library"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Write-Output "NEO starts."
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/NEO-Plus-Setup-${{ needs.sync.outputs.version }}.exe
            dist/NEO-Plus-Setup-${{ needs.sync.outputs.version }}.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  # NEO+ for Macs (Apple silicon and Intel). It isn't signed with an Apple
  # Developer ID (that takes a paid Apple account), only ad-hoc signed, so a
  # Mac asks once before opening it (System Settings → Privacy & Security →
  # Open Anyway), and it can't install its own updates: NEO+ says when a new
  # version is out instead (neo-plus/main.js). Its own app id and name, so it
  # never mixes with Hugh's NEO on the same Mac.
  mac:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Test on a Mac
        run: |
          npx electron scripts/neo-plus.e2e.js
          npx electron scripts/neo-plus-library.e2e.js
      - name: Test the macOS spellchecker
        run: npx electron scripts/neo-plus-spell.e2e.js
      - name: Test Read Aloud (the Mac voices)
        run: npx electron scripts/neo-plus-read.e2e.js
      - name: Google sign-in for this build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          node -e "require('fs').writeFileSync('neo-plus/google-client.json', JSON.stringify({ client_id: process.env.GOOGLE_CLIENT_ID || '', client_secret: process.env.GOOGLE_CLIENT_SECRET || '' }))"
      - name: Build the Mac app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder --mac dmg --arm64 --x64 --publish never \
            -c.extraMetadata.version=${{ needs.sync.outputs.version }} \
            -c.extraMetadata.productName='NEO+' \
            -c.productName='NEO+' \
            -c.appId=com.ethaneveritt.neoplus \
            -c.mac.identity=- \
            -c.mac.hardenedRuntime=false \
            -c.mac.notarize=false \
            -c.dmg.artifactName='NEO-Plus-${version}-${arch}.${ext}' \
            -c.publish.provider=github \
            -c.publish.owner=${{ github.repository_owner }} \
            -c.publish.repo=${{ github.event.repository.name }} 2>&1 | tee "$RUNNER_TEMP/build.log" || {
              tail -40 "$RUNNER_TEMP/build.log" | tr '\n' ' ' | cut -c1-3500 | sed 's/^/::error title=electron-builder::/'
              exit 1
            }
          ls dist
      - name: The app is whole and signed
        run: |
          app="dist/mac-arm64/NEO+.app"
          node scripts/neo-plus-check-asar.js "$app/Contents/Resources/app.asar"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"
          for a in arm64 x64; do test -f "dist/NEO-Plus-${{ needs.sync.outputs.version }}-$a.dmg"; done
      - name: Smoke test — the app starts and makes its library
        run: |
          "dist/mac-arm64/NEO+.app/Contents/MacOS/NEO+" > "$RUNNER_TEMP/run.log" 2>&1 &
          pid=$!
          sleep 25
          if ! kill -0 $pid 2>/dev/null; then echo "::error::NEO+ exited at once"; tail -20 "$RUNNER_TEMP/run.log"; exit 1; fi
          test -f "$HOME/Documents/NEO Library/library.json" || { echo "::error::NEO+ started but never made its library"; exit 1; }
          kill $pid
          echo "NEO+ starts on a Mac."
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/NEO-Plus-${{ needs.sync.outputs.version }}-*.dmg
          if-no-files-found: error

  # One release, created once, when both builds passed. (Letting
  # electron-builder publish raced its own uploads into two releases.)
  publish:
    needs: [sync, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.sync.outputs.version }}
          ls dist
          want=$(sed -n 's/^path: *//p' dist/latest.yml)
          if [ "$want" != "NEO-Plus-Setup-$v.exe" ]; then echo "::error::latest.yml names '$want'"; exit 1; fi
          gh release create "v$v" "dist/NEO-Plus-Setup-$v.exe" "dist/NEO-Plus-Setup-$v.exe.blockmap" dist/latest.yml \
            "dist/NEO-Plus-$v-arm64.dmg" "dist/NEO-Plus-$v-x64.dmg" \
            --repo "${{ github.repository }}" --target "${{ needs.sync.outputs.sha }}" \
            --title "NEO+ $v" --notes "NEO+ $v: Hugh Howey's NEO ${{ needs.sync.outputs.neo }} with Google Drive, comments and notes, natural-voice Read Aloud and more.

          Windows: NEO-Plus-Setup-$v.exe (installs and updates on its own).
          Mac: NEO-Plus-$v-arm64.dmg for Apple silicon (M1 and later), NEO-Plus-$v-x64.dmg for Intel. The first time, macOS asks before opening it: System Settings → Privacy & Security → Open Anyway. NEO+ tells you when a new version is out." --latest
