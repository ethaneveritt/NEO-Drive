# NEO-Drive: keeps Ethan's fork current with Hugh Howey's NEO and ships it.
#
# Every day (and on every push to main, and by hand from the Actions tab):
#   1. merge Hugh's newest release tag from github.com/hughhowey/neo
#   2. run the NEO-Drive tests on the merged code
#   3. if anything changed since the last release, build the Windows
#      installer and publish it as a release here — the copy of NEO on
#      Ethan's computer finds it and updates itself, as it always has.
#
# If Hugh's changes collide with ours, nothing is merged or released: the
# run fails, an issue is opened, and the installed NEO stays as it is.
#
# Versions: Hugh's 1.4.0 becomes 1.4.1, 1.4.2, … here (patch × 100 + build),
# so ours always sort after his and after our own earlier builds.

name: NEO-Drive sync and release

on:
  schedule:
    - cron: '17 9 * * *'   # 5:17 am New York (EDT)
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: neo-drive-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch Hugh's releases (kept apart from our own tags)
        run: |
          git remote add upstream https://github.com/hughhowey/neo.git
          git fetch --no-tags upstream main '+refs/tags/v*:refs/upstream-tags/v*'
          latest=$(git for-each-ref --format='%(refname:short)' refs/upstream-tags | sed 's#^upstream-tags/##' | sort -V | tail -1)
          echo "Hugh's latest release: $latest"
          echo "UPSTREAM_TAG=$latest" >> "$GITHUB_ENV"

      - name: Merge it
        id: merge
        run: |
          git config user.name "neo-drive-bot"
          git config user.email "neo-drive-bot@users.noreply.github.com"
          if git merge-base --is-ancestor "refs/upstream-tags/$UPSTREAM_TAG" HEAD; then
            echo "Already have $UPSTREAM_TAG."
            exit 0
          fi
          if git merge --no-edit -m "Merge Hugh's NEO $UPSTREAM_TAG" "refs/upstream-tags/$UPSTREAM_TAG"; then
            echo "Merged $UPSTREAM_TAG."
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "conflict=1" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Report a conflict
        if: failure() && steps.merge.outputs.conflict == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Hugh's $UPSTREAM_TAG doesn't merge cleanly"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then exit 0; fi
          {
            echo "NEO $UPSTREAM_TAG changed code that NEO-Drive also changes, so it wasn't merged and nothing was released."
            echo "Your installed NEO keeps working as it is."
            echo
            echo "Files in conflict:"
            sed 's/^/- /' conflicts.txt
            echo
            echo "Ask Claude to resolve the merge with Hugh's $UPSTREAM_TAG."
          } > body.md
          gh issue create --title "$title" --body-file body.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the merged code
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/neo-drive-*.test.js
          xvfb-run -a npx electron --no-sandbox scripts/neo-drive.e2e.js

      - name: Push the merge
        run: git push origin HEAD:main

      - name: Decide whether to release
        id: plan
        run: |
          git fetch --tags origin
          last=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$last" ] && git diff --quiet "$last" HEAD; then
            echo "Nothing new since $last."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(node -p "require('./package.json').version")
          IFS=. read -r maj min pat <<< "$base"
          lo=$((pat * 100)); n=0
          for t in $(git tag -l "v$maj.$min.*"); do
            p=${t##*.}
            if [ "$p" -gt "$lo" ] && [ "$p" -lt $((lo + 100)) ] && [ $((p - lo)) -gt "$n" ]; then n=$((p - lo)); fi
          done
          version="$maj.$min.$((lo + n + 1))"
          echo "Releasing $version (Hugh's $base + NEO-Drive)."
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # The updater in the installed app reads its source from this build's
      # publish settings: this repo, not Hugh's.
      - name: Build and publish the installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis --x64 --publish always \
            -c.extraMetadata.version=${{ needs.sync.outputs.version }} \
            -c.publish.provider=github \
            -c.publish.owner=${{ github.repository_owner }} \
            -c.publish.repo=${{ github.event.repository.name }} \
            -c.publish.releaseType=release 2>&1 | tee build.log || {
              # surface the cause as an annotation, readable without the raw log
              tail -40 build.log | tr '\n' ' ' | cut -c1-3500 | sed 's/^/::error title=electron-builder::/'
              exit 1
            }
          ls dist
