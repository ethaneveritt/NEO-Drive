# NEO-Drive: Edit → Spellcheck With → Windows Spellchecker, tested on a real
# Windows machine (results as annotations). Run by hand from the Actions tab.
name: NEO-Drive Windows checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Spellcheck with the Windows checker
        run: npx electron scripts/neo-drive-spell.e2e.js
      - name: Read Aloud with the natural voices (every voice)
        if: always()
        env:
          NEO_DRIVE_ALL_VOICES: '1'
        run: npx electron scripts/neo-drive-read.e2e.js
