# NEO-Drive: a one-off speed measurement of the voice model on Windows.
name: NEO-Drive voice benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p b/onnx b/voices && cd b
          base=https://huggingface.co/onnx-community/Kokoro-82M-v1.0-ONNX/resolve/main
          for f in onnx/model_quantized.onnx onnx/model.onnx onnx/model_fp16.onnx onnx/model_q8f16.onnx voices/af_heart.bin; do curl -fsSL $base/$f -o $f; done
          npm init -y > /dev/null && npm i onnxruntime-node@1.21.0 --silent
          cp ../scripts/neo-drive-voice-bench.js .
          node neo-drive-voice-bench.js . model_fp16.onnx model_q8f16.onnx
